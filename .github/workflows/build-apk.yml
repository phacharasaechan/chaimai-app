name: เริ่มประกอบแอป

on:
  push:
    branches: [main]
    paths: [web/**, app/**, .github/workflows/build-apk.yml]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
          build-root-directory: app

      - name: แก้รหัสคียสตอร์
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > release.jks

      - name: ประกอบแอป
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: chaimai-release-apk
          path: app/app/build/outputs/apk/release/app-release.apk
